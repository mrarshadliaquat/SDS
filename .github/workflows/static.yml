name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download Averon storefront bundle
        run: |
          curl -L "https://tmpfiles.org/dl/wDwzKrLkZpNk/averon-marketplace-pages.zip" -o averon-marketplace-pages.zip
          rm -rf public
          python3 - <<'PY'
          import pathlib, zipfile

          target_root = pathlib.Path('public')
          target_root.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile('averon-marketplace-pages.zip') as archive:
              for item in archive.infolist():
                  safe_name = item.filename.replace('\\', '/').lstrip('/')
                  if not safe_name or safe_name.endswith('/'):
                      continue
                  target = target_root / safe_name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(archive.read(item))
          PY
          test -f public/index.html
      - name: Commit Averon storefront to branch root
        run: |
          cp -a public/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html app.js styles.css delivery-terms.html assets
          if git diff --cached --quiet; then
            echo "Averon storefront is already current."
          else
            git commit -m "Publish Averon storefront files"
            git push
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
